<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2C2C2A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Queens</title>
<style>
:root{--bg:#faf9f5;--fg:#2C2C2A;--mut:#6b6a64;--card:#fff;--line:rgba(44,44,42,.15);--ok:#3B6D11;--okbg:#EAF3DE}
@media(prefers-color-scheme:dark){:root{--bg:#1f1e1d;--fg:#f1efe8;--mut:#a3a199;--card:#2b2a28;--line:rgba(241,239,232,.18);--ok:#C0DD97;--okbg:#27500A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));min-height:100svh;display:flex;flex-direction:column;gap:10px}
h1{font-size:20px;font-weight:600;margin:0}
.top{display:flex;justify-content:space-between;align-items:center}
.lv{display:flex;gap:6px}
.lv button{flex:1;padding:8px 0;font-size:13px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bar{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
.bar b{color:var(--fg);font-weight:600}
#bw{width:min(100%,calc(100svh - 340px));min-width:260px;margin:0 auto;container-type:inline-size}
#g{display:grid;width:100%;aspect-ratio:1;border:2px solid #2C2C2A;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;position:relative}
#g div{overflow:hidden;line-height:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;color:#2C2C2A;cursor:pointer}
#g div.q{font-size:calc(100cqw / var(--n) * .72)}#g div.x{font-size:calc(100cqw / var(--n) * .5)}
#g div.hr{box-shadow:inset 0 0 0 3px #4a4a47}#g div.tg{box-shadow:inset 0 0 0 4px #A32D2D}
.row{display:flex;gap:8px}.row button{flex:1}
#msg{min-height:3.6em;font-size:13.5px;line-height:1.45;color:var(--fg);margin:0;text-align:left}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.35)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 16px;text-align:center}
.win{background:var(--okbg);color:var(--ok);border-color:transparent}
.win h2{margin:6px 0 4px;font-size:20px}.win p{margin:0 0 14px;color:var(--fg)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov .panel{width:100%;max-width:420px;text-align:left}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 12px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500;font-size:12px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
 <div class="top"><h1>Queens</h1><button id="bs">Stats</button></div>
 <button id="ba" style="font-size:13px">Auto &times;: On</button>
 <div class="lv" id="lv"></div>
 <div class="lv" id="tv"></div>
 <div class="bar"><span id="qc">0 / 5</span><span>Streak <b id="sk">0</b></span><span>Best <b id="bt">--</b></span><b id="tm">0:00</b></div>
 <div id="play">
  <div id="bw"><div id="g"></div></div>
  <div class="row" style="margin-top:10px"><button id="bu">Undo</button><button id="bh">Hint</button></div>
  <div class="row" style="margin-top:8px"><button id="bz">Reset</button><button id="bn">New puzzle</button></div>
  <p id="msg"></p>
 </div>
 <div id="win" class="panel win hide">
  <div style="font-size:40px">&#10003;</div>
  <h2>Puzzle solved</h2>
  <p id="wt"></p>
  <div class="row"><button id="pa" class="on">Next puzzle</button></div>
 </div>
</div>
<div class="ov" id="ov"><div class="panel">
 <b style="font-size:18px">Your stats</b>
 <table id="stt"></table>
 <p style="font-size:12px;color:var(--mut);margin:0 0 12px">Solves that use a hint don't count for best times or streaks. Abandoning a started puzzle resets your streak.</p>
 <div class="row"><button id="rst">Reset stats</button><button id="cl" class="on">Close</button></div>
</div></div>
<script src="gen.js"></script>
<script src="app.js"></script>
</body>
</html>
